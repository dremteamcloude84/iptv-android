# Buduje plik APK automatycznie na serwerach GitHuba po każdym wgraniu zmian.
# Gotowy plik: zakładka Actions → najnowsze uruchomienie → sekcja Artifacts → "IPTV-Player-APK".
name: Zbuduj APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Budowanie APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-APK
          path: app/build/outputs/apk/release/*.apk

plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.iptvplayer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.iptvplayer.app'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // podpis kluczem debug – wystarczy do instalacji z pliku APK na własnych urządzeniach
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

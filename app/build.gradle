plugins {
    id 'com.android.application'
}

android {
    namespace 'pl.iptvplayer.app'
    compileSdk 35

    defaultConfig {
        applicationId 'pl.iptvplayer.app'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    // stały klucz podpisu – kolejne wersje APK instalują się jako aktualizacja (bez odinstalowywania)
    signingConfigs {
        release {
            storeFile file('iptv-release.jks')
            storePassword 'iptvplayer'
            keyAlias 'iptv'
            keyPassword 'iptvplayer'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // sprzętowy odtwarzacz wideo (ten sam silnik co w TiviMate i aplikacjach Google)
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
}
